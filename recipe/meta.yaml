{% set name = "opendrift" %}
{% set version = "1.14.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/opendrift-{{ version }}.tar.gz
  sha256: 8a943cd82d38a3a1f3bc639083bf6d29c102f77a99714d7a52bc0795f3838532

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0
  entry_points:
    - hodograph = opendrift.scripts.hodograph:main
    - readerinfo = opendrift.scripts.readerinfo:main
    - opendrift_plot = opendrift.scripts.opendrift_plot:main
    - opendrift_animate = opendrift.scripts.opendrift_animate:main
    - opendrift_gui = opendrift.scripts.opendrift_gui:main


requirements:
  host:
    - python {{ python_min }}
    - pip
  run:
    - python >={{ python_min }}
    - cartopy >=0.20
    - cmocean >=3
    - coloredlogs >=15
    - geojson >=2
    - geopandas >=0.14
    - matplotlib-base >=3.5
    - nc-time-axis >=1.4
    - netcdf4 >=1.6
    - numpy >=1.23
    - pynucos >=3
    - pyproj >=2.3
    - proj <9.8
    - requests >=2
    - roaring-landmask >=0.11
    - scipy >=1.9
    - utm >=0.7
    - xarray >=2025
    - dask-core >=2025
    - gdal >=3
    - pykdtree
    - xhistogram >=0.3
    - trajan >=0.12
    - adios_db >1.2
    - copernicusmarine >=2
    - bottleneck
    - ffmpeg
    - python-dotenv

test:
  imports:
    - opendrift
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://pypi.org/project/opendrift/
  summary: OpenDrift - a framework for ocean trajectory modeling
  license: GPL-2.0-or-later
  license_file: LICENSE

extra:
  recipe-maintainers:
    - gauteh
    - knutfrode
